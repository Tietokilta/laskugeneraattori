services:
  laskugeneraattori:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: development
    environment:
      - PORT=3000
      - BIND_ADDR=0.0.0.0
      - ALLOWED_ORIGINS=
      # Required. The service refuses to start without it, because a missing CMS would silently
      # book every invoice against the unassigned account.
      - CMS_URL=https://tietokilta.fi
      - MAILGUN_URL=
      - MAILGUN_USER=
      - MAILGUN_PASSWORD=
      - MAILGUN_TO=
      - MAILGUN_FROM=
    ports:
      - "3000:3000"
    restart: always
