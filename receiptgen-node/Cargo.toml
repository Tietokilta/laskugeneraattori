[package]
name = "receiptgen-node"
version = "0.1.0"
edition = "2021"
authors = ["Luukas Pörtfors <lajp@iki.fi>"]

[lib]
crate-type = ["cdylib"]

[dependencies]

napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json = "1.0.145"
laskugeneraattori = { path = ".." }
garde = { version = "0.22.0", features = ["derive"] }
typst-pdf = { version = "0.13.1" }

