name: CI
on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  docker_tag_prefix: ghcr.io/tietokilta

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Check formatting
        run: nix build .#checks.x86_64-linux.formatting --print-build-logs

  checks:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            max-jobs = auto
      # The cache holds only the compiled Rust dependencies (see `.#deps`).
      # Everything else is fetched from cache.nixos.org, which is faster than
      # restoring it from the Actions cache.
      - name: Restore Nix store cache
        id: cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Build dependencies
        id: deps
        # The out-link is a GC root, so the dependencies survive the GC below
        run: nix build .#deps --out-link deps --print-build-logs
      - name: Build, Clippy and Tests
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.laskugeneraattori \
            .#checks.x86_64-linux.laskugeneraattori-clippy \
            .#checks.x86_64-linux.laskugeneraattori-test
      - name: Build Docker image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published')
        run: cp "$(nix build .#docker --no-link --print-out-paths)" image.tar.gz
      - name: Upload Docker image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published')
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          compression-level: 0
          retention-days: 1
      # Save even if the checks fail, as long as the dependencies built
      - name: Save Nix store cache
        if: always() && steps.deps.outcome == 'success' && steps.cache.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.cache.outputs.primary-key }}
          # Drop everything that isn't reachable from a GC root
          gc-max-store-size-linux: 0

  docker-push:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published')
    needs: [checks, formatting]
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Push image
        env:
          CREDS: ${{ github.repository_owner }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS="sha-$GITHUB_SHA"
          if [ "$GITHUB_REF" = refs/heads/main ]; then TAGS+=" latest"; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAGS+=" $GITHUB_REF_NAME ${GITHUB_REF_NAME%.*}"; fi
          for TAG in $TAGS; do
            skopeo copy --dest-creds "$CREDS" docker-archive:image.tar.gz "docker://$docker_tag_prefix/laskugeneraattori:$TAG"
          done

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Login via Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: tikweb-invoice-generator-prod
          images: "${{ env.docker_tag_prefix }}/laskugeneraattori:sha-${{ github.sha }}"
