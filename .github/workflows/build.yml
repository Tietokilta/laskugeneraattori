name: CI
on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  docker_tag_prefix: ghcr.io/tietokilta
  NIX_CACHE_PATHS: |
    /nix/store
    /nix/var/nix/db
    /nix/var/nix/profiles

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Restore Nix store cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NIX_CACHE_PATHS }}
          key: nix-fmt-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-fmt-${{ runner.os }}-
      - name: Check formatting
        run: nix build .#checks.x86_64-linux.formatting --print-build-logs
      - name: Garbage collect Nix store
        if: always()
        run: nix-collect-garbage
      - name: Save Nix store cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NIX_CACHE_PATHS }}
          key: nix-fmt-${{ runner.os }}-${{ hashFiles('flake.lock') }}

  checks:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Restore Nix store cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NIX_CACHE_PATHS }}
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-
      - name: Build
        run: nix build .#checks.x86_64-linux.laskugeneraattori --print-build-logs
      - name: Clippy
        run: nix build .#checks.x86_64-linux.laskugeneraattori-clippy --print-build-logs
      - name: Tests
        run: nix build .#checks.x86_64-linux.laskugeneraattori-test --print-build-logs
      - name: Garbage collect Nix store
        if: always()
        run: nix-collect-garbage
      - name: Save Nix store cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NIX_CACHE_PATHS }}
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}

  docker-build-and-push:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published')
    needs: [checks, formatting]
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Restore Nix store cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NIX_CACHE_PATHS }}
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-
      - name: Build Docker image
        run: nix build .#docker --print-build-logs
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push image
        run: |
          docker load < result

          TAGS=()
          TAGS+=("sha-${{ github.sha }}")

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS+=("latest")
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            TAGS+=("$VERSION")
            MAJOR_MINOR=$(echo "$VERSION" | sed 's/\.[^.]*$//')
            TAGS+=("$MAJOR_MINOR")
          fi

          for TAG in "${TAGS[@]}"; do
            docker tag laskugeneraattori:latest "${{ env.docker_tag_prefix }}/laskugeneraattori:$TAG"
            docker push "${{ env.docker_tag_prefix }}/laskugeneraattori:$TAG"
          done

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    steps:
      - name: Login via Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: tikweb-invoice-generator-prod
          images: "${{ env.docker_tag_prefix }}/laskugeneraattori:sha-${{ github.sha }}"
