# Maps each toimikunta to the accounting account its payments are booked against.
# The account becomes the first four digits of the invoice's reference number.
#
# `account` must be exactly 4 digits and must not start with 0: banking systems strip
# leading zeros, which would silently corrupt the routing. Enforced at startup.
# `id` is what the frontend sends. Renaming an id is a breaking API change; editing a
# `name` is free and needs no frontend deploy.
#
# Account 4999 is reserved: invoices that arrive without a toimikunta are booked against it.
# It intentionally does not exist in the bookkeeping, so the treasurer notices and assigns
# them by hand. Do not add a cost pool that uses it.

[[cost_pool]]
id = "Unkown"
name = "Unkown"
account = "4298"

